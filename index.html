
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerary Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="logo">Itinerary Planner</div>
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Where to next?</h1>
                <p>Generate a complete travel itinerary with hotel suggestions.</p>
            </div>
            <div class="search-form-container">
                <form id="itinerary-form">
                    <div class="form-group destination-group">
                        <label for="destination">Country</label>
                        <input type="text" id="destination" placeholder="e.g., Japan">
                    </div>
                    <div class="form-group date-group">
                        <label>Date From — Date To</label>
                        <div class="date-inputs">
                           <input type="date" id="start-date" required>
                           <input type="date" id="end-date" required>
                        </div>
                    </div>
                    <div class="form-group pax-group">
                        <label for="pax">Number of Pax</label>
                        <input type="number" id="pax" min="1" value="1">
                    </div>
                    <button type="submit">Search</button>
                </form>
            </div>
        </section>

        <section class="results-container">
             <div class="loading-spinner" id="loading"></div>
             <section id="hotel-suggestion"></section>
             <section id="itinerary-output"></section>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
